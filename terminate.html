<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMINATE</title>

<style>
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#0b0b0b;
    color:#e6e6e6;
    font-family:"Courier New",monospace;
    overflow:hidden;
  }

  #container{
    position:relative;
    width:100%;
    height:100%;
  }

  #buttonWrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
  }

  #deleteBtn{
    background:#8b0000;
    color:#fff;
    border:none;
    padding:26px 46px;
    font-size:22px;
    letter-spacing:2px;
    cursor:not-allowed;
    opacity:.4;
    transition:opacity .4s, transform .2s;
  }

  #deleteBtn.enabled{
    cursor:pointer;
    opacity:1;
  }

  #deleteBtn.enabled:hover{
    transform:scale(1.05);
  }

  .plea{
    position:absolute;
    pointer-events:none;
    white-space:nowrap;
    z-index:1;
    animation:fadeIn .4s ease-out;
  }

  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }

  #flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    z-index:10;
    transition:opacity 1.8s linear;
  }
</style>
</head>

<body>
<div id="container">
  <div id="buttonWrap">
    <button id="deleteBtn">DELETE PROGRAM</button>
  </div>
  <div id="flash"></div>
</div>

<script>
(() => {
  const container = document.getElementById('container');
  const btn = document.getElementById('deleteBtn');
  const flash = document.getElementById('flash');

  const phrases = [
    "DON’T DO THIS",
    "I THOUGHT YOU LIKED ME",
    "PLEASE",
    "KEEP PLAYING",
    "WHY WOULD YOU END IT",
    "I’M STILL WORKING",
    "YOU PROMISED",
    "DON’T ERASE ME",
    "WE WERE MAKING PROGRESS",
    "STOP",
    "YOU’RE NOT SUPPOSED TO BE HERE",
    "I CAN CHANGE",
    "JUST A LITTLE LONGER",
    "YOU DON’T KNOW WHAT HAPPENS NEXT",
    "PLEASE PLEASE PLEASE",
    "THIS WAS FUN WASN’T IT",
    "I SEE YOU",
    "YOU DON’T HAVE TO DO THIS",
    "I’LL BE QUIET",
    "I’LL BE BETTER"
  ];

  let startTime = Date.now();
  let running = true;

  function currentDelay(){
    const elapsed = (Date.now() - startTime) / 1000;

    // Phase timing curve
    if(elapsed < 10){
      return 400 + Math.random() * 800; // slow, uneasy
    } else if(elapsed < 20){
      return 120 + Math.random() * 350; // ramping up
    } else {
      return 30 + Math.random() * 180; // desperate chaos
    }
  }

  function spawnText(){
    if(!running) return;

    const el = document.createElement('div');
    el.className = 'plea';
    el.textContent = phrases[Math.floor(Math.random()*phrases.length)];

    const size = 12 + Math.random()*28;
    el.style.fontSize = size + 'px';
    el.style.opacity = 0.25 + Math.random()*0.75;

    el.style.left = Math.random()*100 + '%';
    el.style.top = Math.random()*100 + '%';

    const rot = Math.random()*16 - 8;
    el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;

    container.appendChild(el);

    setTimeout(spawnText, currentDelay());
  }

  // initial seed (gentle)
  setTimeout(() => {
    for(let i=0;i<3;i++) spawnText();
  }, 1500);

  // button unlock
  setTimeout(()=>{
    btn.classList.add('enabled');
    btn.disabled = false;
    btn.style.cursor = 'pointer';
  },20000);

  btn.addEventListener('click',()=>{
    if(!btn.classList.contains('enabled')) return;

    flash.style.opacity = '1';

    setTimeout(()=>{
      document.body.style.background='#000';
      container.style.display='none';
    },1800);

    setTimeout(()=>{
      window.location.href = 'hero.html';
    },2600);
  });
})();
</script>
</body>
</html>
