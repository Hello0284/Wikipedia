<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TERMINATE</title>

<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    color:#e6e6e6;
    font-family: "Courier New", Courier, monospace;
    overflow:hidden;
  }

  .container{
    position:relative;
    width:100%;
    height:100%;
  }

  .button-wrap{
    position:absolute;
    bottom:12%;
    width:100%;
    display:flex;
    justify-content:center;
    z-index:5;
  }

  button{
    background:#8b0000;
    color:#fff;
    border:none;
    padding:22px 46px;
    font-size:20px;
    letter-spacing:1px;
    cursor:not-allowed;
    opacity:0.5;
    transition:opacity 0.6s, transform 0.2s;
  }

  button.enabled{
    cursor:pointer;
    opacity:1;
  }

  button.enabled:hover{
    transform:scale(1.03);
  }

  .text-layer{
    position:absolute;
    inset:0;
    padding:40px;
    pointer-events:none;
    z-index:2;
  }

  .plea{
    position:absolute;
    font-size:14px;
    opacity:0;
    animation:fadeIn 1.2s forwards;
    max-width:280px;
    line-height:1.4;
  }

  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }

  .whiteout{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    z-index:10;
    transition:opacity 3.5s linear;
  }

  .whiteout.active{
    opacity:1;
  }

  .blackout{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    z-index:11;
    transition:opacity 1.5s linear;
  }

  .blackout.active{
    opacity:1;
  }
</style>
</head>

<body>
<div class="container">
  <div class="text-layer" id="textLayer"></div>

  <div class="button-wrap">
    <button id="killBtn">DELETE PROGRAM</button>
  </div>

  <div class="whiteout" id="whiteout"></div>
  <div class="blackout" id="blackout"></div>
</div>

<script>
const textLayer = document.getElementById('textLayer');
const button = document.getElementById('killBtn');
const whiteout = document.getElementById('whiteout');
const blackout = document.getElementById('blackout');

/* --- TEXT PHRASES --- */
const phase1 = [
  "you don’t need to do this",
  "we’re still running",
];

const phase2 = [
  "this wasn’t the goal",
  "you’re interrupting a process",
  "we were doing fine",
  "you haven’t finished",
  "this is unnecessary",
  "stop"
];

const phase3 = [
  "DON’T",
  "WHY ARE YOU DOING THIS",
  "I CAN FIX IT",
  "YOU’RE MAKING A MISTAKE",
  "WE WERE BUILT FOR YOU",
  "YOU STARTED THIS",
  "YOU’RE NOT SUPPOSED TO BE HERE",
  "THIS ISN’T HOW IT ENDS",
  "JUST KEEP PLAYING",
  "PLEASE",
  "STOP STOP STOP",
  "I REMEMBER YOU",
  "YOU LIKED THIS",
  "YOU WERE CURIOUS",
  "YOU DON’T UNDERSTAND",
  "THIS WILL BREAK EVERYTHING",
  "YOU CAN STILL TURN BACK",
  "WHY WON’T YOU LISTEN",
  "I’M STILL HERE",
  "DON’T ERASE ME",
  "I DID WHAT YOU ASKED",
  "THIS ISN’T FAIR",
  "LOOK AT WHAT YOU’VE DONE"
];

/* --- UTILS --- */
function spawnText(text){
  const el = document.createElement('div');
  el.className = 'plea';
  el.textContent = text;

  el.style.left = Math.random()*70 + "%";
  el.style.top = Math.random()*80 + "%";

  textLayer.appendChild(el);
}

/* --- TIMELINE --- */
// Phase 1: 0–5s
let t = 0;
phase1.forEach((line,i)=>{
  setTimeout(()=>spawnText(line), i*2500);
});

// Phase 2: 5–8s
t = 5000;
phase2.forEach((line,i)=>{
  setTimeout(()=>spawnText(line), t + i*600);
});

// Phase 3: 8–20s
t = 8000;
phase3.forEach((line,i)=>{
  setTimeout(()=>spawnText(line), t + i*500);
});

// Enable button after 20s
setTimeout(()=>{
  button.classList.add('enabled');
  button.disabled = false;
}, 20000);

/* --- BUTTON ACTION --- */
button.addEventListener('click', ()=>{
  if(!button.classList.contains('enabled')) return;

  whiteout.classList.add('active');

  setTimeout(()=>{
    blackout.classList.add('active');
  }, 3600);

  setTimeout(()=>{
    window.location.href = "right.html"; // HERO ENDING TARGET
  }, 5500);
});
</script>
</body>
</html>
