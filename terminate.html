<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMINATE</title>

<style>
  html,body{
    margin:0;
    height:100%;
    background:#0a0a0a;
    overflow:hidden;
    font-family:"Courier New", Courier, monospace;
    color:#eee;
  }

  #container{
    position:absolute;
    inset:0;
    z-index:1;
  }

  .plea{
    position:absolute;
    font-size:14px;
    opacity:0.85;
    pointer-events:none; /* CRITICAL FIX */
    white-space:nowrap;
    animation: drift linear infinite;
  }

  @keyframes drift{
    from{ transform:translateY(0); }
    to{ transform:translateY(-20px); }
  }

  #ui{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
  }

  #deleteBtn{
    padding:22px 48px;
    font-size:18px;
    letter-spacing:2px;
    background:#b30000;
    color:#fff;
    border:none;
    cursor:not-allowed;
    opacity:0.6;
    position:relative;
    z-index:10;
  }

  #deleteBtn.enabled{
    cursor:pointer;
    opacity:1;
  }

  #flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    z-index:50;
    pointer-events:none;
    transition:opacity 1.6s ease;
  }

  #black{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    z-index:60;
    pointer-events:none;
    transition:opacity 1.2s ease;
  }
</style>
</head>
<body>

<div id="container"></div>

<div id="ui">
  <button id="deleteBtn">DELETE PROGRAM</button>
</div>

<div id="flash"></div>
<div id="black"></div>

<script>
(function(){
  const phrases = [
    "DON'T DO IT",
    "I THOUGHT YOU LIKED ME",
    "PLEASE",
    "STOP",
    "WE WERE DOING SO WELL",
    "JUST KEEP PLAYING",
    "YOU DON'T HAVE TO",
    "I CAN CHANGE",
    "WHY ARE YOU DOING THIS",
    "I'M STILL HERE",
    "YOU PROMISED",
    "THIS HURTS",
    "I SEE YOU",
    "YOU CAN WALK AWAY",
    "WAIT",
    "DON'T ERASE ME",
    "I REMEMBER YOU",
    "THIS WAS FUN",
    "STAY",
    "NO NO NO"
  ];

  const container = document.getElementById('container');
  const btn = document.getElementById('deleteBtn');
  const flash = document.getElementById('flash');
  const black = document.getElementById('black');

  let startTime = Date.now();
  let enabled = false;

  function spawnText(){
    const elapsed = (Date.now() - startTime) / 1000;

    // speed curve: slow → chaotic
    let delay;
    if(elapsed < 10){
      delay = 800 + Math.random()*600;
    } else if(elapsed < 20){
      delay = 200 + Math.random()*400;
    } else {
      delay = 40 + Math.random()*180;
    }

    const el = document.createElement('div');
    el.className = 'plea';
    el.textContent = phrases[Math.floor(Math.random()*phrases.length)];
    el.style.left = Math.random()*100 + '%';
    el.style.top = Math.random()*100 + '%';
    el.style.fontSize = (12 + Math.random()*10) + 'px';
    el.style.opacity = 0.4 + Math.random()*0.6;
    el.style.animationDuration = (6 + Math.random()*10) + 's';

    container.appendChild(el);

    setTimeout(spawnText, delay);
  }

  spawnText();

  // enable button after ~20 seconds
  setTimeout(()=>{
    enabled = true;
    btn.classList.add('enabled');
    btn.style.cursor = 'pointer';
  }, 20000);

  btn.addEventListener('click', ()=>{
    if(!enabled) return;

    flash.style.opacity = 1;

    setTimeout(()=>{
      black.style.opacity = 1;
    }, 1600);

    setTimeout(()=>{
      location.href = "ending_hero.html";
    }, 3000);
  });

})();
</script>

</body>
</html>
