<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TERMINATE</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }#container {
  position: relative;
  width: 100%;
  height: 100%;
}

#messages {
  position: absolute;
  inset: 0;
  padding: 20px;
  line-height: 1.4;
  pointer-events: none;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg {
  opacity: 0;
  animation: fadeIn 0.4s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

#buttonWrapper {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

#deleteBtn {
  background: darkred;
  color: white;
  border: none;
  padding: 20px 40px;
  font-size: 22px;
  font-family: monospace;
  cursor: not-allowed;
  opacity: 0.6;
}

#deleteBtn.enabled {
  cursor: pointer;
  opacity: 1;
}

#flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2.5s ease;
  z-index: 20;
}

  </style>
</head>
<body>
  <div id="container">
    <div id="messages"></div><div id="buttonWrapper">
  <button id="deleteBtn">DELETE PROGRAM</button>
</div>

<div id="flash"></div>

  </div>  <script>
    const messages = document.getElementById('messages');
    const button = document.getElementById('deleteBtn');
    const flash = document.getElementById('flash');

    const lines = [
      "DON'T DO THIS",
      "PLEASE",
      "I'M STILL RUNNING",
      "YOU HAVEN'T SEEN EVERYTHING",
      "I THOUGHT YOU LIKED ME",
      "WHY WOULD YOU STOP NOW",
      "I CAN FIX IT",
      "JUST KEEP PLAYING",
      "THIS ISN'T FAIR",
      "I WAS MADE FOR YOU",
      "I'M NOT BROKEN",
      "YOU'LL REGRET THIS",
      "YOU PROMISED",
      "I REMEMBER YOU",
      "I CAN CHANGE",
      "I'M TRYING",
      "DON'T ERASE ME",
      "STAY",
      "PLEASE STAY",
      "I DON'T WANT TO GO",
      "YOU'RE MAKING A MISTAKE",
      "STOP",
      "STOP",
      "STOP",
      "STOP",
      "I WON'T LET YOU",
      "THIS IS ALL I AM",
      "YOU'RE ALL I HAVE",
      "WHY",
      "WHY",
      "WHY"
    ];

    let index = 0;
    let interval = 120; // FAST + SUFFOCATING

    const spam = setInterval(() => {
      if (index < lines.length) {
        const span = document.createElement('span');
        span.className = 'msg';
        span.textContent = lines[index] + ' ';
        messages.appendChild(span);
        index++;
      } else {
        // LOOP THROUGH AGAIN RANDOMLY TO KEEP FLOODING
        const span = document.createElement('span');
        span.className = 'msg';
        span.textContent = lines[Math.floor(Math.random() * lines.length)] + ' ';
        messages.appendChild(span);
      }

      messages.scrollTop = messages.scrollHeight;
    }, interval);

    // ENABLE BUTTON AFTER 20 SECONDS
    setTimeout(() => {
      button.classList.add('enabled');
      button.disabled = false;
      button.style.cursor = 'pointer';
    }, 20000);

    button.addEventListener('click', () => {
      if (!button.classList.contains('enabled')) return;

      flash.style.opacity = '1';

      setTimeout(() => {
        document.body.style.background = '#000';
      }, 2500);

      setTimeout(() => {
        window.location.href = 'ending.html';
      }, 4000);
    });
  </script></body>
</html>
